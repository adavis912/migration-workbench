# Apache httpd on clmfrau1-web01: forwards /fraud to Tomcat over AJP.
<VirtualHost *:80>
    ServerName fraud.hvig.internal
    ProxyPass        /fraud ajp://clmfrau1-app02.hvig.internal:8009/fraud-scoring
    ProxyPassReverse /fraud ajp://clmfrau1-app02.hvig.internal:8009/fraud-scoring
</VirtualHost>
